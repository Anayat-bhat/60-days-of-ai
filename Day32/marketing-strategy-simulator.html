<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<style>
  :root {
    --bg: #090c10;
    --panel: #111622;
    --panel-raised: #171d2d;
    --border: #232d40;
    --border-hover: #3b4863;
    --text: #f0f3f8;
    --muted: #8c96a8;
    --accent: #7c66dc;
    --accent-glow: #7c66dc33;
    --amber: #f5a623;
    --amber-glow: #f5a62326;
    --green: #10b981;
    --green-glow: #10b98126;
    --red: #ef4444;
    --red-glow: #ef444426;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, #7c66dc20, transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, #f5a62312, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  #root { min-height: 100vh; }
  
  .app-shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  ::selection { background: var(--accent-glow); }

  .eyebrow {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 11px;
    color: var(--amber);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  h1, h2, h3, h4 {
    font-family: var(--sans);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; }
  h2 { font-size: 22px; }
  h3 { font-size: 16px; }
  h4 { font-size: 14px; }
  
  p { line-height: 1.6; color: var(--text); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; line-height: 1.5; }

  /* Top Console Bar */
  .console-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 24px;
    overflow: hidden;
    position: relative;
  }
  .console-bar .dot-row { display: flex; gap: 6px; }
  .console-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .console-bar .dot.red { background: #ef444488; }
  .console-bar .dot.amber { background: #f5a62388; }
  .console-bar .dot.green { background: #10b98188; }
  .ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 16px;
    -webkit-mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
    mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }
  .ticker {
    display: inline-flex;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    animation: scroll-left 28s linear infinite;
  }
  .ticker span { margin-right: 40px; }
  @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .console-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Progress Rail */
  .progress-rail-container {
    margin-bottom: 26px;
  }
  .stage-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-rail {
    display: flex;
    gap: 5px;
  }
  .progress-seg {
    flex: 1;
    height: 5px;
    border-radius: 4px;
    background: var(--border);
    transition: background 0.3s ease;
  }
  .progress-seg.done { background: var(--accent); }
  .progress-seg.current { background: linear-gradient(90deg, var(--accent), var(--border)); }

  /* Card Layouts */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 20px;
    animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .grid {
    display: grid;
    gap: 14px;
  }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media(max-width: 720px) {
    .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
  }

  /* Choice Cards */
  .choice-card {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: all .2s ease;
    font-family: var(--sans);
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .choice-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    background: #1b2133;
    box-shadow: 0 8px 20px -5px rgba(124, 102, 220, 0.25);
  }
  .choice-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice-card.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .choice-card .icon { font-size: 28px; display: block; margin-bottom: 12px; }

  /* Buttons */
  button.btn {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text);
    padding: 11px 24px;
    cursor: pointer;
    transition: all .18s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  button.btn:hover { border-color: var(--accent); background: #1b2133; }
  button.btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--border) !important; background: var(--panel-raised) !important; }
  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow: 0 4px 14px #7c66dc55;
  }
  button.btn.primary:hover { background: #8e79e8; border-color: #8e79e8; }
  button.btn.secondary-action {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }
  button.btn.secondary-action:hover {
    color: var(--text);
    border-color: var(--border-hover);
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  }

  /* Tags & Badges */
  .tag {
    display: inline-flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-right: 6px;
    margin-bottom: 6px;
  }
  .tag.accent { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }
  .tag.amber { color: var(--amber); border-color: var(--amber); background: var(--amber-glow); }
  .tag.green { color: var(--green); border-color: var(--green); background: var(--green-glow); }
  .tag.red { color: var(--red); border-color: var(--red); background: var(--red-glow); }

  /* Pedagogical Explainer Card */
  .explain-card {
    background: linear-gradient(135deg, #181d2c 0%, #111522 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin: 16px 0 20px;
  }
  .explain-item { margin-bottom: 12px; }
  .explain-item:last-child { margin-bottom: 0; }
  .explain-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .explain-header.what { color: #a5b4fc; }
  .explain-header.why { color: var(--amber); }

  /* Claude Prompt Engineering Card */
  .claude-card {
    border: 1px dashed #7c66dc88;
    background: linear-gradient(160deg, #7c66dc15, #0d1017 70%);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 22px;
  }
  .claude-card .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .claude-card .head-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .claude-card .badge {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    font-family: var(--mono);
  }
  .claude-card .label {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #a5b4fc;
    font-weight: 600;
  }
  .prompt-text {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    color: #d1d5db;
    background: #090c12;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    white-space: pre-wrap;
    margin: 0 0 12px;
    overflow-x: auto;
  }
  .copy-btn {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    transition: all .15s ease;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { background: var(--green-glow); border-color: var(--green); color: var(--green); }

  /* Platform Strategy Cards */
  .platform-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-raised);
    margin-bottom: 12px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .platform-row:hover { border-color: var(--border-hover); background: #1a2030; }
  .platform-row.selected { border-color: var(--green); background: var(--green-glow); }
  .platform-row .check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .platform-row.selected .check { background: var(--green); border-color: var(--green); color: #090c10; }

  /* Content Pillars Cards */
  .pillar-card {
    border: 1px solid var(--border);
    background: var(--panel-raised);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: all .18s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .pillar-card:hover:not(.disabled) { border-color: var(--accent); background: #1a2030; }
  .pillar-card.selected { border-color: var(--accent); background: var(--accent-glow); }
  .pillar-card.disabled { opacity: .4; cursor: not-allowed; }

  /* Roadmap Cards */
  .week-card {
    border-left: 4px solid var(--accent);
    background: var(--panel-raised);
    border-radius: 0 12px 12px 0;
    padding: 16px 20px;
    margin-bottom: 14px;
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .week-card .wk-num { font-family: var(--mono); color: var(--accent); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }

  /* Event Banner & Response */
  .event-banner {
    border: 1px solid var(--red);
    background: var(--red-glow);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  /* Form Elements */
  textarea.free-input, input.free-input, select.free-input {
    width: 100%;
    background: #090c12;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    resize: vertical;
    transition: border-color .15s ease;
  }
  textarea.free-input { min-height: 85px; }
  textarea.free-input:focus, input.free-input:focus, select.free-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* Report Styles */
  .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media(max-width: 720px) { .report-grid { grid-template-columns: 1fr; } }
  .report-item {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .report-item h3 { color: var(--amber); font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  
  .lesson-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .lesson-item:last-child { border-bottom: none; }
  .lesson-num {
    font-family: var(--mono); color: var(--accent); font-weight: 700; font-size: 16px;
    width: 28px; flex-shrink: 0;
  }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
    margin-top: 40px;
    letter-spacing: .06em;
  }
</style>
</head>

--------------------------------------------------------- */

  { name: "Handmade Ceramic Homeware", audience: "Design-conscious apartment renters furnishing their space", challenge: "Lots of Instagram followers but low checkout conversion" },
  { name: "AI Coding Mentorship App", audience: "Self-taught developers and career switchers wanting code reviews", challenge: "Prospects fear the content will be too technical" },
  { name: "Eco-Friendly Running Apparel", audience: "Marathon runners who care deeply about sustainability", challenge: "Perceived as preachy rather than high-performance" },
  { name: "Local Dog Daycare & Training", audience: "Dog parents who feel guilty leaving pets alone while working", challenge: "High trust barrier before handing over house keys/pets" },
  { name: "No-Code SaaS Analytics Tool", audience: "Solo founders and indie hackers building web apps", challenge: "Overwhelmed users abandoning free trials after day 1" }
];

const BUDGETS = ["$500/mo (Bootstrapped)", "$2,500/mo (Small Business)", "$10,000/mo (Growth Stage)"];
const COMPETITORS = ["UrbanNest", "DailyGrind Co.", "NorthStar", "BrightPath", "Halcyon Goods", "Marrow Labs"];

function generateRandomClient() {
  const ind = RANDOM_INDUSTRIES[Math.floor(Math.random() * RANDOM_INDUSTRIES.length)];
  const budget = BUDGETS[Math.floor(Math.random() * BUDGETS.length)];
  const comps = [...COMPETITORS].sort(() => Math.random() - 0.5).slice(0, 2);
  const brandName = ["Kernel", "Verve", "Aura Labs", "Solstice", "Apex", "Echo"][Math.floor(Math.random() * 6)];
  return {
    type: "business",
    brandName,
    industry: ind.name,
    audience: ind.audience,
    budget,
    competitors: comps,
    challenge: ind.challenge
  };
}

function ClaudeCard({ label, prompt }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    navigator.clipboard.writeText(prompt);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <div className="claude-card">
      <div className="head">
        <div className="head-left">
          <div className="badge">C</div>
          <span className="label">How to ask Claude • {label}</span>
        </div>
      </div>
      <pre className="prompt-text">{prompt}</pre>
      <button className={"copy-btn " + (copied ? "copied" : "")} onClick={handleCopy}>
        {copied ? "Copied to Clipboard ✓" : "Copy Reusable Prompt"}
      </button>
    </div>
  );
}

  const isPersonal = brand.type === "personal";
  const eventList = isPersonal ? EVENTS_PERSONAL : EVENTS_BUSINESS;
  
  const [eventData] = useState(() => eventList[Math.floor(Math.random() * eventList.length)]);
  const [response, setResponse] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const handleSubmit = () => {
    if (response.trim()) {
      setSubmitted(true);
    }
  };

  return (
    <div className="card fade-in">
      <div className="eyebrow">Step 7 • Real-World Adaptability</div>
      <h2>Unexpected Market Event</h2>

      <ExplainBox 
        what="Market events simulate sudden viral spikes, competitor moves, or PR challenges that force you to adapt."
        why="Static plans die quickly. True marketing strategists respond to unexpected events with poise, turning crises into growth assets."
      />

      <div className="event-banner">
        <span className="tag red">{eventData.tag}</span>
        <h3 style={{ margin: "8px 0 6px", color: "#fecaca" }}>⚠️ {eventData.title}</h3>
        <p className="small" style={{ margin: 0, color: "#fee2e2" }}>{eventData.detail}</p>
      </div>

      {!submitted ? (
        <div>
          <label className="small muted" style={{ display: "block", marginBottom: 8, fontWeight: 600 }}>
            How will you strategically respond to this event? (Describe your action plan):
          </label>
          <textarea 
            className="free-input" 
            value={response} 
            onChange={e => setResponse(e.target.value)}
            placeholder={isPersonal 
              ? "e.g. I will address the critique gracefully, post a video explaining my exact design process, and link to my newsletter..."
              : "e.g. We will double down on our premium warranty, highlight our original patents, and run a customer loyalty promo..."}
          />
          <button className="btn primary" style={{ marginTop: 12 }} disabled={!response.trim()} onClick={handleSubmit}>
            Analyze My Strategic Reaction
          </button>
        </div>
      ) : (
        <div style={{ background: "var(--panel-raised)", border: "1px solid var(--green)", borderRadius: 12, padding: 18, marginTop: 14 }}>
          <span className="tag green">Strategic Response Logged</span>
          <p className="small" style={{ margin: "8px 0" }}><b>Your Plan:</b> "{response}"</p>
          <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--border)" }}>
            <p className="small" style={{ color: "var(--amber)", margin: "0 0 4px", fontWeight: 700 }}>💡 Strategist Perspective:</p>
            <p className="small muted" style={{ margin: 0 }}>{eventData.takeaway}</p>
          </div>
        </div>
      )}

      <ClaudeCard 
        label="Scenario Reaction Evaluation"
        prompt={isPersonal
          ? `As personal brand ${brand.brandName} (${brand.industry}), I faced this event: "${eventData.title}". My proposed response: "${response || "[My Response]"}". Analyze potential risks and give me 2 tactical tweaks.`
          : `For business ${brand.brandName} (${brand.industry}), we encountered: "${eventData.title}". Proposed action plan: "${response || "[My Plan]"}". Provide a PR & strategy risk assessment.`}
      />

      <div className="btn-row">
        <div></div>
        <button className="btn primary" disabled={!response.trim()} onClick={() => onNext({ event: eventData, response })}>
          Generate Complete Growth Audit →
        </button>
      </div>
    </div>
  );
}

function ReportScreen({ brand, platforms, pillars, eventData, onRestart }) {
  const isPersonal = brand.type === "personal";

  const lessons = isPersonal ? [
    {
      title: "Authenticity over Artificial Polish",
      body: "Personal brands thrive on distinct human perspectives. Polished neutrality is less memorable than genuine, authentic conviction."
    },
    {
      title: "The Consistency Compound Effect",
      body: "Personal brand momentum builds slowly at first, then compounds exponentially through consistent value delivery and long-term trust."
    },
    {
      title: "Relentless Niche Clarity",
      body: "Trying to appeal to everyone dilutes your authority. Dominate a specific niche first before broadening your scope."
    }
  ] : [
    {
      title: "Customer-Centric Problem Solving",
      body: "Effective marketing focuses on customer transformation and outcomes rather than boasting about internal product features."
    },
    {
      title: "Focused Channel Leverage",
      body: "Mastering 1-2 marketing channels creates far more revenue and momentum than maintaining weak presences across 5 channels."
    },
    {
      title: "Strategic Flexibility in Execution",
      body: "Keep your macro strategic goals fixed while keeping micro execution tactical, adaptable, and responsive to market changes."
    }
  ];

  return (
    <div className="card fade-in">
      <div className="eyebrow">Final Step • Growth Audit</div>
      <h1>Strategic Blueprint Report: {brand.brandName}</h1>
      <p className="muted">Summary of your strategic marketing roadmap and core principles.</p>

      <ExplainBox 
        what="This Strategic Growth Audit synthesizes your audience fit, channel focus, content pillars, best decisions, and key takeaways."
        why="Reviewing your complete plan helps solidify strategic principles so you can execute confidently in real-world environments."
      />

      <div className="report-grid" style={{ marginTop: 18 }}>
        <div className="report-item">
          <h3>Audience Understanding</h3>
          <p className="small" style={{ margin: 0 }}>{brand.audience}</p>
        </div>
        <div className="report-item">
          <h3>Platform Strategy</h3>
          <p className="small" style={{ margin: 0 }}>{platforms.join(" • ")}</p>
        </div>
        <div className="report-item">
          <h3>Content Strategy</h3>
          <p className="small" style={{ margin: 0 }}>{pillars.join(" • ")}</p>
        </div>
        <div className="report-item">
          <h3>Growth Potential</h3>
          <p className="small" style={{ margin: 0 }}>
            {isPersonal 
              ? "High — Strong alignment between personal niche authority, chosen high-trust channels, and strategic content pillars."
              : "High — Solid alignment between customer pain points, targeted platform channels, and structured conversion strategy."}
          </p>
        </div>
        <div className="report-item">
          <h3>Best Strategic Decision</h3>
          <p className="small" style={{ margin: 0 }}>
            {isPersonal 
              ? `Limiting distribution to ${platforms.slice(0, 2).join(" & ")} while anchoring content on authentic ${pillars[0]} & ${pillars[1]}.`
              : `Focusing customer acquisition on ${platforms.join(", ")} and structuring content around ${pillars[0]}.`}
          </p>
        </div>
        <div className="report-item">
          <h3>Biggest Trap to Avoid</h3>
          <p className="small" style={{ margin: 0 }}>
            {isPersonal
              ? "Slipping into corporate-speak or abandoning weekly posting consistency when immediate viral results aren't instant."
              : "Pitching hard product sales before building problem awareness and social proof with prospective buyers."}
          </p>
        </div>
      </div>

      <div className="report-item" style={{ marginTop: 16 }}>
        <h3>Market Scenario Reaction Audit</h3>
        <p className="small" style={{ margin: "0 0 4px" }}><b>Scenario Encountered:</b> {eventData.event.title}</p>
        <p className="small muted" style={{ margin: 0 }}><b>Your Logged Response:</b> "{eventData.response}"</p>
      </div>

      <h2 style={{ marginTop: 26, marginBottom: 14 }}>Core Strategic Lessons Learned</h2>
      <div className="report-item">
        {lessons.map((l, i) => (
          <div key={l.title} className="lesson-item">
            <div className="lesson-num">0{i+1}</div>
            <div>
              <h4 style={{ margin: "0 0 4px", color: "var(--text)" }}>{l.title}</h4>
              <p className="small muted" style={{ margin: 0 }}>{l.body}</p>
            </div>
          </div>
        ))}
      </div>

      <ClaudeCard 
        label="Executive Strategy Brief"
        prompt={isPersonal
          ? `Summarize the personal brand strategy for ${brand.brandName} in the ${brand.industry} niche into a 1-page executive action guide. Cover Platforms (${platforms.join(", ")}), Pillars (${pillars.join(", ")}), and Market Event Response.`
          : `Summarize the complete marketing strategy for ${brand.brandName} (${brand.industry}) into an executive brief ready for team execution, covering target audience (${brand.audience}), channels (${platforms.join(", ")}), and pillars (${pillars.join(", ")}).`}
      />

      <div className="btn-row" style={{ marginTop: 28 }}>
        <div></div>
        <button className="btn primary" onClick={onRestart}>
          🔁 Start New Simulation
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   MAIN APPLICATION SHELL
--------------------------------------------------------- */

function App() {
  const [step, setStep] = useState(0);
  const [mode, setMode] = useState(null);
  const [brand, setBrand] = useState(null);
  const [platforms, setPlatforms] = useState([]);
  const [pillars, setPillars] = useState([]);
  const [eventData, setEventData] = useState(null);

  const restart = () => {
    setStep(0);
    setMode(null);
    setBrand(null);
    setPlatforms([]);
    setPillars([]);
    setEventData(null);
  };

  return (
    <div className="app-shell">
      <ConsoleBar />
      
      {step > 0 && <ProgressRail stageIndex={step} />}

      {step === 0 && (
        <WelcomeScreen onStart={() => setStep(1)} />
      )}

      {step === 1 && !mode && (
        <ModeSelectScreen onPick={(m) => setMode(m)} />
      )}

      {step === 1 && mode && (
        <IntakeScreen 
          mode={mode} 
          onComplete={(b) => {
            setBrand(b);
            setStep(2);
          }} 
        />
      )}

      {step === 2 && brand && (
        <AudienceScreen 
          brand={brand} 
          onNext={() => setStep(3)} 
        />
      )}

      {step === 3 && brand && (
        <PlatformSelectScreen 
          brand={brand} 
          onNext={(p) => {
            setPlatforms(p);
            setStep(4);
          }} 
        />
      )}

      {step === 4 && brand && (
        <PillarsScreen 
          brand={brand} 
          onNext={(pil) => {
            setPillars(pil);
            setStep(5);
          }} 
        />
      )}

      {step === 5 && brand && (
        <RoadmapScreen 
          brand={brand} 
          pillars={pillars} 
          onNext={() => setStep(6)} 
        />
      )}

      {step === 6 && brand && (
        <EventScreen 
          brand={brand} 
          onNext={(ev) => {
            setEventData(ev);
            setStep(7);
          }} 
        />
      )}

      {step === 7 && brand && eventData && (
        <ReportScreen 
          brand={brand} 
          platforms={platforms} 
          pillars={pillars} 
          eventData={eventData} 
          onRestart={restart} 
        />
      )}

      <div className="footer-note">
        THINK LIKE A MARKETING STRATEGIST • INTERACTIVE LEARNING APPLICATION
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
